# null in video id ; dups for vid ; for each video view < likes & coments etc
# checks for table name

checks for yt_api:
  - missing_count("Video_ID") = 0
  - duplicate_count("Video_ID") = 0

  - likes_count_greater_than_vid_views = 0:
      name: Check if Likes_Count greater than Video_Views 
      likes_count_greater_than_vid_views query: |
        select count(*) from yt_api where "Likes_Count" > "Video_Views"

  - comments_count_greater_than_vid_views = 0:
      name: Check if Comments_Count greater than Video_Views 
      comments_count_greater_than_vid_views query: |
        select count(*) from yt_api where "Comments_Count" > "Video_Views"



